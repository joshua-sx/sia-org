<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sia dashboard design comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #e9e7e3; color: #111; font: 14px system-ui, sans-serif; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; }
      figure { margin: 0; overflow: hidden; border: 1px solid rgb(0 0 0 / 10%); border-radius: 12px; background: white; }
      figcaption { padding: 10px 12px; border-bottom: 1px solid rgb(0 0 0 / 10%); font-weight: 600; }
      img { display: block; width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>Selected visual target · 1488 × 1058</figcaption>
        <img src="./dashboard-reference.png" alt="Selected operational briefing visual target" />
      </figure>
      <figure>
        <figcaption>Browser implementation · 1440 × 1024</figcaption>
        <img src="./dashboard-desktop.png" alt="Implemented operational briefing dashboard" />
      </figure>
    </main>
  </body>
</html>
